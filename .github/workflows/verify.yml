name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: POCKET_AI_GATEWAY_QUICK_VERIFY=1 ./scripts/verify.sh
