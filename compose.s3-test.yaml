# Optional, disposable S3 protocol fixture; never part of production deployment.
services:
  gateway:
    environment:
      POCKET_E2E_S3_ACCESS: pocket-e2e-access
      POCKET_E2E_S3_SECRET: pocket-e2e-secret
    ports:
      - "127.0.0.1::9000"

  s3:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    network_mode: service:gateway
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
      - /data
    environment:
      MINIO_ROOT_USER: pocket-e2e-access
      MINIO_ROOT_PASSWORD: pocket-e2e-secret
      MINIO_BROWSER: "off"
    command: ["server", "/data", "--address", ":9000"]
