services:
  gateway:
    image: pocket-ai-gateway:local
    build:
      context: .
      args:
        VERSION: local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pocket-gateway-data:/data
      - pocket-gateway-backups:/data_backups
      - pocket-gateway-backups:/backups
    environment:
      POCKET_AI_GATEWAY_BACKUP_KEY: ${POCKET_AI_GATEWAY_BACKUP_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  pocket-gateway-data:
  pocket-gateway-backups:
