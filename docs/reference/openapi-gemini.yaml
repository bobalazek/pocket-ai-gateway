openapi: 3.1.0
info: { title: Pocket AI Gateway Gemini-Compatible API, version: 0.6.0 }
servers: [{ url: /api/gemini/v1beta }]
security: [{ apiKey: [] }]
paths:
  /files:
    post:
      operationId: startGeminiFileUpload
      servers: [{ url: /api/gemini/upload/v1beta }]
      summary: Start an encrypted, key-owned resumable File upload
      description: Requires files:manage. Declare 1–8 MiB using X-Goog-Upload-Header-Content-Length and a MIME type using X-Goog-Upload-Header-Content-Type. The upload session expires after one hour.
      parameters:
        - { name: X-Goog-Upload-Protocol, in: header, required: true, schema: { type: string, const: resumable } }
        - { name: X-Goog-Upload-Command, in: header, required: true, schema: { type: string, const: start } }
        - { name: X-Goog-Upload-Header-Content-Length, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 8388608 } }
        - { name: X-Goog-Upload-Header-Content-Type, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { file: { type: object } } } } } }
      responses:
        "200": { description: Empty JSON with X-Goog-Upload-URL pointing to the same gateway and X-Goog-Upload-Status active }
        default: { description: Gemini-compatible error }
    get:
      operationId: listGeminiFiles
      summary: List the key's unexpired Files
      parameters:
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: pageToken, in: query, schema: { type: string } }
      responses:
        "200": { description: Files array and optional nextPageToken }
        default: { description: Gemini-compatible error }
  /files/{file_id}:
    post:
      operationId: uploadGeminiFileChunk
      servers: [{ url: /api/gemini/upload/v1beta }]
      security: [{ apiKey: [] }, {}]
      summary: Upload and optionally finalize a resumable session
      description: Here file_id is the 144-bit upload capability from X-Goog-Upload-URL. The follow-up may omit the key header; if supplied, it must match the creating files:manage key. The URL expires after one hour and must be kept private. Identical chunk/finalize retries are idempotent. Finalization returns a File with a gateway-local URI.
      parameters:
        - { name: file_id, in: path, required: true, schema: { type: string } }
        - { name: X-Goog-Upload-Command, in: header, required: true, schema: { type: string, enum: [upload, finalize, 'upload, finalize'] } }
        - { name: X-Goog-Upload-Offset, in: header, required: true, schema: { type: integer, minimum: 0 } }
      requestBody: { content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: Active upload or finalized File with X-Goog-Upload-Status }
        default: { description: Gemini-compatible error }
    get:
      operationId: getGeminiFile
      parameters: [{ name: file_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Key-owned, unexpired File metadata }, "404": { description: File not found for this key }, default: { description: Gemini-compatible error } }
    delete:
      operationId: deleteGeminiFile
      parameters: [{ name: file_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Empty JSON object after key-owned deletion }, "404": { description: File not found for this key }, default: { description: Gemini-compatible error } }
  /live:
    get:
      operationId: connectGeminiLive
      description: Upgrades HTTP/1.1 to a native Gemini BidiGenerateContent WebSocket. The first message must contain setup.model as models/{public_model}; the gateway resolves and rewrites it before relaying bidirectional audio, video, text, tool, and resumption messages. Frames are limited to 16 MiB and the session to ten minutes.
      responses:
        "101": { description: WebSocket protocol switch; setup is the first application message }
        "400": { description: Missing WebSocket upgrade }
        "401": { description: Invalid or missing inference key }
        "404": { description: No capable native target }
        "503": { description: Admission, pricing, or provider configuration unavailable }
        default: { description: Gemini-compatible error before upgrade, or an error message after upgrade }
  /interactions:
    post:
      operationId: createGeminiInteraction
      summary: Create a bounded stateless text Interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, input]
              properties:
                model: { type: string }
                input: { type: string, minLength: 1 }
                store: { type: boolean, const: false, default: false }
                stream: { type: boolean, const: false, default: false }
                background: { type: boolean, const: false, default: false }
                tools: { type: array, maxItems: 0 }
                generation_config:
                  type: object
                  additionalProperties: false
                  properties:
                    max_output_tokens: { type: integer, minimum: 1 }
      responses:
        "200": { description: Native completed or incomplete Interaction with the public model alias and provider usage }
        default: { description: Gemini-compatible error }
  /models:
    get:
      operationId: listGeminiModels
      description: Lists public models this API key may call through a route target that supports a Gemini-compatible operation.
      responses:
        "200": { description: Authorized public models, content: { application/json: { schema: { type: object, required: [models], properties: { models: { type: array, items: { $ref: "#/components/schemas/Model" } } } } } } }
        default: { description: Gemini-compatible error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /models/{model}:
    get:
      operationId: getGeminiModel
      parameters: [{ name: model, in: path, required: true, description: Public model ID, with or without the models/ prefix, schema: { type: string } }]
      responses:
        "200": { description: Authorized public model, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
        "404": { description: Model unavailable to this key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { description: Gemini-compatible error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /models/{model}:{action}:
    post:
      operationId: runGeminiModelAction
      parameters:
        - { name: model, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [generateContent, streamGenerateContent, countTokens, embedContent, batchEmbedContents] } }
      description: Gateway-owned fileData.fileUri is resolved to inline data only for generateContent, streamGenerateContent, and countTokens. At most four same-key references and 8 MiB combined source bytes; expanded JSON is limited to 16 MiB and requires a native Gemini target. Interactions and other model actions reject File URIs.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { "200": { description: Native JSON or text/event-stream response }, default: { description: Gemini-compatible error } }
components:
  schemas:
    Model:
      type: object
      required: [name, displayName, supportedGenerationMethods]
      properties:
        name: { type: string, pattern: "^models/", description: models/ plus the public model ID }
        displayName: { type: string }
        description: { type: string }
        supportedGenerationMethods:
          type: array
          items: { type: string, enum: [generateContent, countTokens, embedContent, interactions, BidiGenerateContent] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code: { type: integer }
            message: { type: string }
            status: { type: string, examples: [INVALID_ARGUMENT, RESOURCE_EXHAUSTED, NOT_FOUND] }
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: x-goog-api-key }
