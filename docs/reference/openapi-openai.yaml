openapi: 3.1.0
info: { title: Pocket AI Gateway OpenAI-Compatible API, version: 0.10.0 }
servers: [{ url: /api/openai/v1 }]
security: [{ bearerAuth: [] }]
paths:
  /models:
    get: { operationId: listOpenAIModels, responses: { "200": { description: Authorized public models }, default: { description: OpenAI-compatible error } } }
  /models/{id}:
    get:
      operationId: getOpenAIModel
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Authorized public model }, "404": { description: Model unavailable }, default: { description: OpenAI-compatible error } }
  /chat/completions:
    get:
      operationId: listChatCompletions
      description: Lists unexpired gateway-stored Chat Completions owned by the creating API key using bounded keyset pages.
      parameters:
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: model, in: query, schema: { type: string } }
        - { name: metadata, in: query, style: deepObject, explode: true, schema: { type: object, maxProperties: 16, propertyNames: { maxLength: 64 }, additionalProperties: { type: string, maxLength: 512 } } }
      responses: { "200": { description: Cursor page of stored Chat Completions }, default: { description: OpenAI-compatible error } }
    post:
      operationId: createChatCompletion
      description: Native or translated generation. store:true creates a gateway-owned 30-day resource for the creating key, keeps upstream storage disabled, requires a non-streaming request, and limits array message content to text/image_url parts so the stored message-list schema remains valid. Omitted, null, or false store remains stateless.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [model, messages], properties: { model: { type: string }, messages: { type: array, minItems: 1, items: { type: object, required: [role], properties: { role: { type: string, minLength: 1 }, content: { oneOf: [{ type: string }, { type: "null" }, { type: array, minItems: 1, items: { oneOf: [{ type: object, required: [type, text], properties: { type: { const: text }, text: { type: string } }, additionalProperties: true }, { type: object, required: [type, image_url], properties: { type: { const: image_url }, image_url: { type: object, required: [url], properties: { url: { type: string, minLength: 1 } }, additionalProperties: true } }, additionalProperties: true }] } }] } }, additionalProperties: true } }, store: { oneOf: [{ type: boolean }, { type: "null" }], default: false }, stream: { oneOf: [{ type: boolean }, { type: "null" }], default: false }, metadata: { oneOf: [{ type: object, maxProperties: 16, propertyNames: { maxLength: 64 }, additionalProperties: { type: string, maxLength: 512 } }, { type: "null" }] } }, additionalProperties: true } } } }
      responses: { "200": { description: Native or translated JSON, text/event-stream, or gateway-stored Chat Completion }, default: { description: OpenAI-compatible error } }
  /chat/completions/{completion_id}:
    parameters: [{ name: completion_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getChatCompletion
      responses: { "200": { description: Stored Chat Completion }, "404": { description: Missing, expired, or foreign-key resource }, default: { description: OpenAI-compatible error } }
    post:
      operationId: updateChatCompletion
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [metadata], properties: { metadata: { oneOf: [{ type: object, maxProperties: 16, propertyNames: { maxLength: 64 }, additionalProperties: { type: string, maxLength: 512 } }, { type: "null" }] } }, additionalProperties: false } } } }
      responses: { "200": { description: Updated stored Chat Completion }, "404": { description: Missing, expired, or foreign-key resource }, default: { description: OpenAI-compatible error } }
    delete:
      operationId: deleteChatCompletion
      responses: { "200": { description: Chat Completion deletion object }, "404": { description: Missing, expired, or foreign-key resource }, default: { description: OpenAI-compatible error } }
  /chat/completions/{completion_id}/messages:
    get:
      operationId: listChatCompletionMessages
      description: Lists the original input messages in stable request order for a stored Chat Completion.
      parameters:
        - { name: completion_id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses: { "200": { description: Cursor page of stored input messages }, "404": { description: Missing, expired, or foreign-key resource }, default: { description: OpenAI-compatible error } }
  /responses:
    post:
      operationId: createResponse
      description: >-
        Creates a response. Non-streaming responses are stored by default for the creating API key.
        Synchronous JSON, durable background, and store:false streaming requests may attach a
        gateway-owned conversation by ID. Attached streams are bounded; a successful terminal event
        is replayed after the Conversation turn is stored, while response.failed or error is replayed
        without changing the Conversation. background:true queues durable gateway execution and
        requires storage. store:false disables the stored Response resource and is required for
        streaming; an attached Conversation remains retained state. A request with one web_search tool
        requires responses:web_search, public and upstream chat plus web_search capability, an OpenAI-adapter target using the built-in openai preset, max_tool_calls from 1 through 4, and positive max_output_tokens. It supports optional
        function tools and web_search_call.action.sources, and may be stateless, stored for 30 days, or
        background. Web search is JSON-only and rejects Conversations, previous_response_id/provider
        references, preview or image-search tool variants, unlimited search-token return, translation, post-dispatch fallback, free-only/lowest-cost
        routing, and spend policies. The gateway always sends store:false upstream. Token usage and the
        completed web-search call count are recorded separately; provider search cost is unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
                input: { oneOf: [{ type: string }, { type: array, items: { type: object } }, { type: "null" }], description: Web search rejects provider-owned response, Conversation, item, file, and container references }
                instructions: { type: [string, "null"] }
                conversation: { oneOf: [{ type: string }, { type: object, required: [id], properties: { id: { type: string } }, additionalProperties: false }, { type: "null" }], description: Rejected when web_search is present }
                previous_response_id: { type: [string, "null"], description: Rejected when web_search is present }
                tools:
                  type: [array, "null"]
                  description: At most one WebSearchTool may accompany function tools
                  items:
                    oneOf:
                      - { type: object, required: [type], properties: { type: { const: function } }, additionalProperties: true }
                      - { $ref: "#/components/schemas/WebSearchTool" }
                include:
                  type: [array, "null"]
                  items: { type: string }
                  description: With web search, the only accepted value is web_search_call.action.sources
                tool_choice: { description: Native OpenAI tool selection; may be a string or typed object }
                parallel_tool_calls: { type: [boolean, "null"] }
                max_tool_calls: { type: [integer, "null"], minimum: 1, maximum: 4, description: Required when web_search is present }
                max_output_tokens: { type: [integer, "null"], minimum: 1, description: Required when web_search is present }
                temperature: { type: [number, "null"], minimum: 0, maximum: 2 }
                top_p: { type: [number, "null"], minimum: 0, maximum: 1 }
                text: { type: [object, "null"], additionalProperties: true }
                reasoning: { type: [object, "null"], additionalProperties: true }
                truncation: { type: [string, "null"], enum: [auto, disabled, null] }
                metadata: { type: [object, "null"], maxProperties: 16, propertyNames: { maxLength: 64 }, additionalProperties: { type: string, maxLength: 512 } }
                store: { type: boolean, default: true }
                stream: { type: [boolean, "null"], description: true is rejected when web_search is present }
                background: { type: boolean, default: false }
              additionalProperties: true
      responses:
        "200":
          description: Native or translated Responses JSON or lifecycle event stream; web search returns JSON containing native web_search_call output items and token usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: array
                    items:
                      anyOf:
                        - { $ref: "#/components/schemas/ResponseWebSearchCall" }
                        - { type: object, description: Another native Responses output item }
                  usage:
                    type: object
                    required: [input_tokens, output_tokens, total_tokens]
                    properties:
                      input_tokens: { type: integer, minimum: 0 }
                      output_tokens: { type: integer, minimum: 0 }
                      total_tokens: { type: integer, minimum: 0 }
                    additionalProperties: true
                additionalProperties: true
        default: { description: OpenAI-compatible error }
  /responses/compact:
    post:
      operationId: compactResponse
      description: Compacts inline input through the native OpenAI preset. Gateway response, conversation, item, file, and container references are rejected.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [model, input], not: { required: [stream] }, properties: { model: { type: string }, input: { oneOf: [{ type: string }, { type: array, items: { type: object } }] } }, additionalProperties: true } } } }
      responses: { "200": { description: Native response.compaction object }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /responses/input_tokens:
    post:
      operationId: countResponseInputTokens
      description: Counts direct model/input requests through a native capable OpenAI target. Provider-owned response, conversation, item, file, and container references are rejected.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [model], properties: { model: { type: string }, input: { oneOf: [{ type: string }, { type: array, items: { type: object } }, { type: "null" }] }, instructions: { oneOf: [{ type: string }, { type: "null" }] }, tools: { oneOf: [{ type: array, items: { type: object, required: [type], properties: { type: { const: function } }, additionalProperties: true } }, { type: "null" }] } }, additionalProperties: true } } } }
      responses: { "200": { description: response.input_tokens count object }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /images/generations:
    post:
      operationId: generateImage
      description: Generates images through a native image-capable OpenAI target. Streaming, partial images, automatic post-dispatch fallback, lowest-cost/free-only routing, and operation under active token/output/spend policies are not supported. Request and response bodies are limited to 16 MiB.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [model, prompt], properties: { model: { type: string }, prompt: { type: string, minLength: 1, maxLength: 32000 }, n: { oneOf: [{ type: integer, minimum: 1, maximum: 10 }, { type: "null" }] }, output_compression: { oneOf: [{ type: integer, minimum: 0, maximum: 100 }, { type: "null" }] }, stream: { oneOf: [{ const: false }, { type: "null" }] } }, additionalProperties: true } } } }
      responses: { "200": { description: Native OpenAI images response }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /images/edits:
    post:
      operationId: editImage
      description: Edits 1-16 valid PNG, JPEG, or WebP uploads through a native GPT Image target. Each image must be under 50 MB, an optional same-size PNG mask under 4 MB, the aggregate multipart body is limited to 64 MiB, and the response to 16 MiB. An explicit public model, prompt, and images:edit scope are required. Provider fields pass through and only the model is rewritten. DALL-E 2's separate edit contract, streaming, post-dispatch fallback, lowest-cost/free-only routing, and operation under active token/output/spend policies are not supported.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, model, prompt]
              properties:
                image: { oneOf: [{ type: string, format: binary }, { type: array, minItems: 1, maxItems: 16, items: { type: string, format: binary } }] }
                mask: { type: string, format: binary }
                model: { type: string }
                prompt: { type: string, minLength: 1, maxLength: 32000 }
                n: { oneOf: [{ type: integer, minimum: 1, maximum: 10 }, { type: "null" }] }
                output_compression: { oneOf: [{ type: integer, minimum: 0, maximum: 100 }, { type: "null" }] }
                stream: { oneOf: [{ const: false }, { type: "null" }] }
              additionalProperties: true
      responses: { "200": { description: Native OpenAI images response }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /images/variations:
    post:
      operationId: createImageVariation
      description: Creates variations from one valid square PNG under 4 MB through a native image-variation-capable target. An explicit public model and images:variation scope are required. The OpenAI preset accepts only upstream dall-e-2; custom OpenAI-compatible endpoints remain operator-declared. Multipart bodies and responses are bounded to 64 MiB and 16 MiB. Post-dispatch fallback, lowest-cost/free-only routing, and operation under active token/output/spend policies are not supported.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, model]
              properties:
                image: { type: string, format: binary }
                model: { type: string }
                n: { oneOf: [{ type: integer, minimum: 1, maximum: 10 }, { type: "null" }] }
                response_format: { oneOf: [{ type: string, enum: [url, b64_json] }, { type: "null" }] }
                size: { oneOf: [{ type: string, enum: [256x256, 512x512, 1024x1024] }, { type: "null" }] }
              additionalProperties: true
      responses: { "200": { description: Native OpenAI images response }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /audio/speech:
    post:
      operationId: createSpeech
      description: Generates speech through a native audio-speech-capable OpenAI target. The gateway accepts built-in voices, buffers at most 16 MiB, and returns the provider audio content type. Custom voice references, SSE, automatic post-dispatch fallback, lowest-cost/free-only routing, and operation under active token/output/spend policies are not supported.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [model, input, voice], properties: { model: { type: string }, input: { type: string, minLength: 1, maxLength: 4096 }, voice: { type: string, enum: [alloy, ash, ballad, coral, echo, fable, onyx, nova, sage, shimmer, verse, marin, cedar] }, instructions: { oneOf: [{ type: string }, { type: "null" }] }, response_format: { oneOf: [{ type: string, enum: [mp3, opus, aac, flac, wav, pcm] }, { type: "null" }] }, stream_format: { oneOf: [{ const: audio }, { type: "null" }] }, stream: { oneOf: [{ const: false }, { type: "null" }] }, speed: { oneOf: [{ type: number, minimum: 0.25, maximum: 4 }, { type: "null" }] } }, additionalProperties: true } } } }
      responses: { "200": { description: Buffered audio file from the provider }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /audio/transcriptions:
    post:
      operationId: createTranscription
      description: Transcribes one audio upload through a native audio-transcription-capable OpenAI target. Multipart bodies are limited to 26 MiB, the audio file to 25 MB, and non-streaming responses to 16 MiB. The gateway preserves supported provider fields and rewrites only the model. Streaming responses pass through. Automatic post-dispatch fallback, lowest-cost/free-only routing, and operation under active token/output/spend policies are not supported.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file: { type: string, format: binary }
                model: { type: string }
                language: { type: string }
                prompt: { type: string }
                response_format: { type: string }
                stream: { oneOf: [{ type: boolean }, { type: "null" }], default: false }
                temperature: { type: number }
                timestamp_granularities: { type: array, items: { type: string } }
              additionalProperties: true
      responses: { "200": { description: Native transcription response or event stream }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /audio/translations:
    post:
      operationId: createAudioTranslation
      description: Translates one audio upload into English through a native audio-translation-capable OpenAI target. The OpenAI preset currently requires upstream model whisper-1; custom OpenAI-compatible endpoints remain operator-declared. Multipart bodies are limited to 26 MiB, the audio file to 25 MB, and responses to 16 MiB. The gateway preserves supported provider fields and rewrites only the model. Streaming, automatic post-dispatch fallback, lowest-cost/free-only routing, and operation under active token/output/spend policies are not supported.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file: { type: string, format: binary }
                model: { type: string }
                prompt: { type: string }
                response_format: { type: string, enum: [json, text, srt, verbose_json, vtt] }
                temperature: { type: number, minimum: 0, maximum: 1 }
              additionalProperties: true
      responses: { "200": { description: Native translation response }, "404": { description: No capable native target }, default: { description: OpenAI-compatible error } }
  /responses/{response_id}:
    parameters: [{ name: response_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getResponse
      responses: { "200": { description: Stored response owned by the authenticated API key }, "404": { description: Response unavailable }, default: { description: OpenAI-compatible error } }
    delete:
      operationId: deleteResponse
      responses: { "200": { description: Response deletion result }, "404": { description: Response unavailable }, default: { description: OpenAI-compatible error } }
  /responses/{response_id}/cancel:
    post:
      operationId: cancelResponse
      parameters: [{ name: response_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Cancelled queued or in-progress response }, "404": { description: Response unavailable }, default: { description: OpenAI-compatible error } }
  /responses/{response_id}/input_items:
    get:
      operationId: listResponseInputItems
      parameters:
        - { name: response_id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: "include[]", in: query, description: Currently rejected because provider-owned projections are not retained, schema: { type: array, items: { type: string } } }
      responses: { "200": { description: Stored input items owned by the authenticated API key }, "404": { description: Response unavailable }, default: { description: OpenAI-compatible error } }
  /conversations:
    post:
      operationId: createConversation
      description: Creates a gateway-owned conversation for the authenticated API key.
      requestBody: { content: { application/json: { schema: { type: object, properties: { metadata: { oneOf: [{ type: object, maxProperties: 16, propertyNames: { maxLength: 64 }, additionalProperties: { type: string, maxLength: 512 } }, { type: "null" }] }, items: { oneOf: [{ type: array, maxItems: 20, items: { type: object } }, { type: "null" }] } }, additionalProperties: false } } } }
      responses: { "200": { description: Conversation }, default: { description: OpenAI-compatible error } }
  /conversations/{conversation_id}:
    parameters: [{ name: conversation_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getConversation
      responses: { "200": { description: Conversation owned by the authenticated API key }, "404": { description: Conversation unavailable }, default: { description: OpenAI-compatible error } }
    post:
      operationId: updateConversation
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [metadata], properties: { metadata: { oneOf: [{ type: object, maxProperties: 16, propertyNames: { maxLength: 64 }, additionalProperties: { type: string, maxLength: 512 } }, { type: "null" }] } }, additionalProperties: false } } } }
      responses: { "200": { description: Updated conversation }, "404": { description: Conversation unavailable }, default: { description: OpenAI-compatible error } }
    delete:
      operationId: deleteConversation
      responses: { "200": { description: Conversation deletion result }, "404": { description: Conversation unavailable }, default: { description: OpenAI-compatible error } }
  /conversations/{conversation_id}/items:
    parameters: [{ name: conversation_id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: createConversationItems
      parameters: [{ name: "include[]", in: query, description: Rejected until provider-owned projections have gateway storage, schema: { type: array, items: { type: string } } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, minItems: 1, maxItems: 20, items: { type: object } } }, additionalProperties: false } } } }
      responses: { "200": { description: Added gateway-owned items }, "404": { description: Conversation unavailable }, default: { description: OpenAI-compatible error } }
    get:
      operationId: listConversationItems
      parameters:
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: "include[]", in: query, description: Rejected until provider-owned projections have gateway storage, schema: { type: array, items: { type: string } } }
      responses: { "200": { description: Cursor page of gateway-owned items }, "404": { description: Conversation or cursor unavailable }, default: { description: OpenAI-compatible error } }
  /conversations/{conversation_id}/items/{item_id}:
    parameters: [{ name: conversation_id, in: path, required: true, schema: { type: string } }, { name: item_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getConversationItem
      parameters: [{ name: "include[]", in: query, description: Rejected until provider-owned projections have gateway storage, schema: { type: array, items: { type: string } } }]
      responses: { "200": { description: Gateway-owned conversation item }, "404": { description: Item unavailable }, default: { description: OpenAI-compatible error } }
    delete:
      operationId: deleteConversationItem
      responses: { "200": { description: Parent conversation after item deletion }, "404": { description: Item unavailable }, default: { description: OpenAI-compatible error } }
  /batches:
    post:
      operationId: createOpenAIBatch
      description: >-
        Creates a gateway-owned Batch for the requesting API key. The input_file_id must identify an
        unexpired same-key purpose=batch File containing one to four same-model, non-streaming
        POST /v1/responses, /v1/chat/completions, /v1/embeddings, /v1/moderations,
        /v1/images/generations, or /v1/images/edits JSONL requests with unique
        1–64-byte UTF-8 custom_id values.
        Only completion_window 24h is accepted. The endpoint requires its matching scope. Moderations
        require moderations:classify, use ordinary validation and native routing without fallback, and
        leave aggregate Batch usage null because moderation responses have no usage object. Image
        generations require images:generate, while edits require images:edit plus one to sixteen HTTPS
        or bounded PNG/JPEG/WebP base64 data-URL image references and reject provider file_id references.
        Both use native non-streaming routing without fallback and
        expose aggregate usage only when terminal Batch usage is complete; otherwise it is null.
        The local worker uses ordinary endpoint routing, admission, accounting, and prices;
        OpenAI's provider Batch discount, rate pool, and larger limits do not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateRequest"
      responses:
        "200": { description: Newly created gateway-owned Batch, content: { application/json: { schema: { $ref: "#/components/schemas/Batch" } } } }
        "404": { description: Input File is missing, expired, or owned by another key }
        default: { description: OpenAI-compatible error }
    get:
      operationId: listOpenAIBatches
      description: Lists Batches owned by the requesting API key using bounded keyset pages.
      parameters:
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Cursor page of gateway-owned Batches, content: { application/json: { schema: { $ref: "#/components/schemas/BatchList" } } } }
        default: { description: OpenAI-compatible error }
  /batches/{batch_id}:
    parameters: [{ name: batch_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: retrieveOpenAIBatch
      responses:
        "200": { description: Gateway-owned Batch, content: { application/json: { schema: { $ref: "#/components/schemas/Batch" } } } }
        "404": { description: Missing or foreign-key Batch }
        default: { description: OpenAI-compatible error }
  /batches/{batch_id}/cancel:
    parameters: [{ name: batch_id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelOpenAIBatch
      description: Requests cancellation. Already-dispatched work may finish and remains available in partial output Files.
      responses:
        "200": { description: Cancelling or cancelled gateway-owned Batch, content: { application/json: { schema: { $ref: "#/components/schemas/Batch" } } } }
        "404": { description: Missing or foreign-key Batch }
        default: { description: OpenAI-compatible error }
  /uploads:
    post:
      operationId: createOpenAIUpload
      description: >-
        Creates a gateway-owned multipart Upload for the requesting API key. The bounded first contract
        requires purpose=batch, a .jsonl filename, mime_type application/jsonl, and a declared byte count
        from 1 through 16 MiB. The pending Upload expires one hour after creation. Optional expires_after
        controls the completed File lifetime from one hour through 30 days. Every operation requires
        files:manage; no part or completed File is sent to a provider or entered into inference accounting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCreateRequest" }
      responses:
        "200": { description: Pending gateway-owned Upload, content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } } }
        default: { description: OpenAI-compatible error }
  /uploads/{upload_id}/parts:
    parameters: [{ name: upload_id, in: path, required: true, schema: { type: string, pattern: "^upload_" } }]
    post:
      operationId: createOpenAIUploadPart
      description: >-
        Adds one non-empty encrypted Part to a pending same-key Upload. Each Part is at most 16 MiB and an
        Upload accepts at most 16 Parts. Parts may be created in any order; completion supplies the final order.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data: { type: string, format: binary, description: Non-empty Part bytes, at most 16 MiB }
      responses:
        "200": { description: Encrypted gateway-owned Upload Part, content: { application/json: { schema: { $ref: "#/components/schemas/UploadPart" } } } }
        "400": { description: Upload is expired or terminal, Part is empty, or Part bounds are invalid }
        "404": { description: Upload is missing or owned by another key }
        default: { description: OpenAI-compatible error }
  /uploads/{upload_id}/complete:
    parameters: [{ name: upload_id, in: path, required: true, schema: { type: string, pattern: "^upload_" } }]
    post:
      operationId: completeOpenAIUpload
      description: >-
        Completes a pending same-key Upload by concatenating the listed Parts in the caller-supplied order.
        Every Part ID must belong to the Upload, may appear once, and the resulting byte count must exactly
        match the declared Upload bytes. The result is a processed purpose=batch File. The optional OpenAI
        non-empty md5 field is rejected in this constrained first slice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCompleteRequest" }
      responses:
        "200": { description: Completed Upload with its ready gateway-owned File, content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } } }
        "400": { description: Upload is expired or terminal, Part selection is invalid, or byte total does not match }
        "404": { description: Upload is missing or owned by another key }
        default: { description: OpenAI-compatible error }
  /uploads/{upload_id}/cancel:
    parameters: [{ name: upload_id, in: path, required: true, schema: { type: string, pattern: "^upload_" } }]
    post:
      operationId: cancelOpenAIUpload
      description: Cancels a pending same-key Upload and permanently removes its encrypted Parts.
      responses:
        "200": { description: Cancelled gateway-owned Upload, content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } } }
        "400": { description: Upload is expired, completed, or already cancelled }
        "404": { description: Upload is missing or owned by another key }
        default: { description: OpenAI-compatible error }
  /files:
    post:
      operationId: createOpenAIFile
      description: >-
        Stores one non-empty JSONL file owned by the creating API key for later gateway-owned Batch use.
        The only accepted purpose is batch, the file is limited to 16 MiB, and the complete multipart
        request is limited to 17 MiB. Files expire 30 days after creation by default. An earlier expiry
        may use expires_after[anchor]=created_at and expires_after[seconds] from 3600 through 2592000.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, purpose]
              properties:
                file: { type: string, format: binary, description: Non-empty .jsonl content, at most 16 MiB }
                purpose: { const: batch }
                expires_after:
                  type: object
                  additionalProperties: false
                  required: [anchor, seconds]
                  properties:
                    anchor: { const: created_at }
                    seconds: { type: integer, minimum: 3600, maximum: 2592000 }
      responses:
        "200": { description: Processed gateway-owned file, content: { application/json: { schema: { $ref: "#/components/schemas/FileObject" } } } }
        default: { description: OpenAI-compatible error }
    get:
      operationId: listOpenAIFiles
      description: Lists unexpired files owned by the requesting API key using bounded keyset pages.
      parameters:
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: purpose, in: query, schema: { type: string, enum: [batch, batch_output] } }
      responses:
        "200": { description: Cursor page of gateway-owned files, content: { application/json: { schema: { $ref: "#/components/schemas/FileList" } } } }
        default: { description: OpenAI-compatible error }
  /files/{file_id}:
    parameters: [{ name: file_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: retrieveOpenAIFile
      responses:
        "200": { description: Gateway-owned file, content: { application/json: { schema: { $ref: "#/components/schemas/FileObject" } } } }
        "404": { description: Missing, expired, or foreign-key file }
        default: { description: OpenAI-compatible error }
    delete:
      operationId: deleteOpenAIFile
      responses:
        "200": { description: File deletion object, content: { application/json: { schema: { $ref: "#/components/schemas/FileDeleted" } } } }
        "404": { description: Missing, expired, or foreign-key file }
        default: { description: OpenAI-compatible error }
  /files/{file_id}/content:
    get:
      operationId: downloadOpenAIFile
      description: Returns the exact uploaded bytes for an unexpired file owned by the requesting API key.
      parameters: [{ name: file_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Exact stored file content
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
            Content-Disposition: { schema: { type: string }, description: Attachment with the validated upload filename }
            Content-Length: { schema: { type: integer, minimum: 1 }, description: Stored plaintext byte count }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { description: Missing, expired, or foreign-key file }
        default: { description: OpenAI-compatible error }
  /embeddings:
    post:
      operationId: createEmbedding
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [model, input], additionalProperties: true } } } }
      responses: { "200": { description: Native embedding response }, default: { description: OpenAI-compatible error } }
  /moderations:
    post:
      operationId: createModeration
      description: Classifies bounded input on a native moderation-capable OpenAI target. The provider taxonomy is preserved rather than translated. Streaming is rejected before dispatch. Usage is recorded as an estimate because the native response has no token-usage field.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [model, input], properties: { model: { type: string }, input: { oneOf: [{ type: string }, { type: array, minItems: 1, items: { type: string } }, { type: array, minItems: 1, items: { oneOf: [{ type: object, required: [type, text], properties: { type: { const: text }, text: { type: string } }, additionalProperties: true }, { type: object, required: [type, image_url], properties: { type: { const: image_url }, image_url: { type: object, required: [url], properties: { url: { type: string, minLength: 1 } }, additionalProperties: true } }, additionalProperties: true }] } }] } }, additionalProperties: true } } } }
      responses: { "200": { description: Native OpenAI moderation response }, default: { description: OpenAI-compatible error } }
components:
  schemas:
    UploadCreateRequest:
      type: object
      additionalProperties: false
      required: [bytes, filename, mime_type, purpose]
      properties:
        bytes: { type: integer, minimum: 1, maximum: 16777216, description: Exact completed plaintext byte count }
        filename: { type: string, minLength: 7, maxLength: 512, pattern: "\\.jsonl$" }
        mime_type: { const: application/jsonl }
        purpose: { const: batch }
        expires_after: { $ref: "#/components/schemas/UploadFileExpiresAfter" }
    UploadFileExpiresAfter:
      type: object
      additionalProperties: false
      required: [anchor, seconds]
      properties:
        anchor: { const: created_at }
        seconds: { type: integer, minimum: 3600, maximum: 2592000 }
    UploadCompleteRequest:
      type: object
      additionalProperties: false
      required: [part_ids]
      properties:
        part_ids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: { type: string, pattern: "^part_" }
          description: Caller-supplied concatenation order
        md5:
          type: [string, "null"]
          maxLength: 0
          description: May be omitted, null, or empty; checksum validation is unsupported and non-empty values are rejected
    Upload:
      type: object
      additionalProperties: false
      required: [id, object, bytes, created_at, expires_at, filename, purpose, status]
      properties:
        id: { type: string, pattern: "^upload_" }
        object: { const: upload }
        bytes: { type: integer, minimum: 1, maximum: 16777216, description: Declared completed byte count }
        created_at: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        expires_at: { type: integer, minimum: 0, description: Pending Upload deadline, one hour after creation }
        filename: { type: string, minLength: 7, maxLength: 512, pattern: "\\.jsonl$" }
        purpose: { const: batch }
        status: { type: string, enum: [pending, completed, cancelled, expired] }
        file:
          oneOf:
            - $ref: "#/components/schemas/FileObject"
            - { type: "null" }
          description: Ready purpose=batch File on successful completion; otherwise null or omitted
    UploadPart:
      type: object
      additionalProperties: false
      required: [id, object, created_at, upload_id]
      properties:
        id: { type: string, pattern: "^part_" }
        object: { const: upload.part }
        created_at: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        upload_id: { type: string, pattern: "^upload_" }
    BatchCreateRequest:
      type: object
      additionalProperties: false
      required: [input_file_id, endpoint, completion_window]
      properties:
        input_file_id: { type: string, pattern: "^file_", description: Unexpired same-key purpose=batch File }
        endpoint: { type: string, enum: [/v1/responses, /v1/chat/completions, /v1/embeddings, /v1/moderations, /v1/images/generations, /v1/images/edits] }
        completion_window: { const: 24h }
        metadata:
          type: [object, "null"]
          maxProperties: 16
          propertyNames: { maxLength: 64 }
          additionalProperties: { type: string, maxLength: 512 }
        output_expires_after:
          type: object
          additionalProperties: false
          required: [anchor, seconds]
          properties:
            anchor: { const: created_at }
            seconds: { type: integer, minimum: 3600, maximum: 2592000 }
    Batch:
      type: object
      additionalProperties: false
      required: [id, object, endpoint, input_file_id, completion_window, status, created_at]
      properties:
        id: { type: string, pattern: "^batch_" }
        object: { const: batch }
        endpoint: { type: string, enum: [/v1/responses, /v1/chat/completions, /v1/embeddings, /v1/moderations, /v1/images/generations, /v1/images/edits] }
        input_file_id: { type: string, pattern: "^file_" }
        completion_window: { const: 24h }
        status: { type: string, enum: [validating, failed, in_progress, finalizing, completed, expired, cancelling, cancelled] }
        created_at: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        in_progress_at: { type: [integer, "null"], minimum: 0 }
        expires_at: { type: [integer, "null"], minimum: 0, description: 24-hour processing deadline }
        finalizing_at: { type: [integer, "null"], minimum: 0 }
        completed_at: { type: [integer, "null"], minimum: 0 }
        failed_at: { type: [integer, "null"], minimum: 0 }
        expired_at: { type: [integer, "null"], minimum: 0 }
        cancelling_at: { type: [integer, "null"], minimum: 0 }
        cancelled_at: { type: [integer, "null"], minimum: 0 }
        output_file_id: { type: [string, "null"], pattern: "^file_" }
        error_file_id: { type: [string, "null"], pattern: "^file_" }
        metadata:
          type: [object, "null"]
          maxProperties: 16
          propertyNames: { maxLength: 64 }
          additionalProperties: { type: string, maxLength: 512 }
        model: { type: [string, "null"], description: Single public model used by all input requests }
        errors:
          oneOf:
            - $ref: "#/components/schemas/BatchErrors"
            - { type: "null" }
        request_counts:
          oneOf:
            - $ref: "#/components/schemas/BatchRequestCounts"
            - { type: "null" }
        usage:
          oneOf:
            - $ref: "#/components/schemas/BatchUsage"
            - { type: "null" }
    BatchErrors:
      type: object
      additionalProperties: false
      properties:
        object: { const: list }
        data: { type: array, items: { $ref: "#/components/schemas/BatchError" } }
    BatchError:
      type: object
      additionalProperties: false
      properties:
        code: { type: string }
        line: { type: [integer, "null"], minimum: 1 }
        message: { type: string }
        param: { type: [string, "null"] }
    BatchRequestCounts:
      type: object
      additionalProperties: false
      required: [total, completed, failed]
      properties:
        total: { type: integer, minimum: 0, maximum: 4 }
        completed: { type: integer, minimum: 0, maximum: 4 }
        failed: { type: integer, minimum: 0, maximum: 4 }
    BatchUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, input_tokens_details, output_tokens, output_tokens_details, total_tokens]
      properties:
        input_tokens: { type: integer, minimum: 0 }
        input_tokens_details:
          type: object
          additionalProperties: false
          required: [cached_tokens]
          properties: { cached_tokens: { type: integer, minimum: 0 } }
        output_tokens: { type: integer, minimum: 0 }
        output_tokens_details:
          type: object
          additionalProperties: false
          required: [reasoning_tokens]
          properties: { reasoning_tokens: { type: integer, minimum: 0 } }
        total_tokens: { type: integer, minimum: 0 }
    BatchList:
      type: object
      additionalProperties: false
      required: [object, data, first_id, last_id, has_more]
      properties:
        object: { const: list }
        data: { type: array, items: { $ref: "#/components/schemas/Batch" } }
        first_id: { type: [string, "null"] }
        last_id: { type: [string, "null"] }
        has_more: { type: boolean }
    FileObject:
      type: object
      additionalProperties: false
      required: [id, object, bytes, created_at, expires_at, filename, purpose, status]
      properties:
        id: { type: string, pattern: "^file_" }
        object: { const: file }
        bytes: { type: integer, minimum: 1, maximum: 16777216 }
        created_at: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        expires_at: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        filename: { type: string, minLength: 1, maxLength: 512 }
        purpose: { type: string, enum: [batch, batch_output] }
        status: { const: processed, deprecated: true }
        status_details: { type: [string, "null"], deprecated: true }
    FileDeleted:
      type: object
      additionalProperties: false
      required: [id, object, deleted]
      properties:
        id: { type: string, pattern: "^file_" }
        object: { const: file }
        deleted: { const: true }
    FileList:
      type: object
      additionalProperties: false
      required: [object, data, first_id, last_id, has_more]
      properties:
        object: { const: list }
        data: { type: array, items: { $ref: "#/components/schemas/FileObject" } }
        first_id: { type: [string, "null"] }
        last_id: { type: [string, "null"] }
        has_more: { type: boolean }
    WebSearchTool:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: web_search }
        search_context_size: { type: [string, "null"], enum: [low, medium, high, null], default: medium }
        external_web_access: { type: [boolean, "null"], description: Defaults to live access when omitted }
        return_token_budget: { type: string, enum: [default], description: Explicit null and the unlimited value are rejected to retain a bounded response contract }
        filters:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                allowed_domains: { type: [array, "null"], maxItems: 100, items: { type: string, minLength: 1, maxLength: 253 }, description: Domain names without a scheme, port, path, query, or fragment }
                blocked_domains: { type: [array, "null"], maxItems: 100, items: { type: string, minLength: 1, maxLength: 253 }, description: Domain names without a scheme, port, path, query, or fragment }
            - { type: "null" }
        user_location:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type: { const: approximate }
                city: { type: [string, "null"], minLength: 1, maxLength: 255 }
                country: { type: [string, "null"], minLength: 1, maxLength: 255 }
                region: { type: [string, "null"], minLength: 1, maxLength: 255 }
                timezone: { type: [string, "null"], minLength: 1, maxLength: 255 }
            - { type: "null" }
    ResponseWebSearchCall:
      type: object
      required: [id, type, status, action]
      properties:
        id: { type: string }
        type: { const: web_search_call }
        status: { type: string, enum: [in_progress, searching, completed, failed, incomplete] }
        action:
          type: object
          description: Native search, open_page, or find_in_page action; sources are present when requested through include
          required: [type]
          properties:
            type: { type: string, enum: [search, open_page, find_in_page] }
            queries: { type: array, items: { type: string } }
            query: { type: string, deprecated: true }
            url: { type: string }
            pattern: { type: string }
            sources: { type: array, items: { type: object, additionalProperties: true } }
          additionalProperties: true
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
