openapi: 3.1.0
info:
  title: Pocket AI Gateway Management API
  version: 0.7.0
  description: Implemented identity, limits, usage, pricing, provider, model, request-history, backup, audit, configuration, and diagnostics management surface. Compatible inference APIs have separate protocol specifications.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/setup/status:
    get:
      security: []
      operationId: setupStatus
      responses:
        "200":
          description: Safe setup state
          content:
            application/json:
              schema:
                type: object
                required: [setup_required, setup_recovery_available]
                properties:
                  setup_required: { type: boolean }
                  setup_recovery_available: { type: boolean }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/setup/claim:
    post:
      security: []
      operationId: claimOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerClaim" }
      responses:
        "201": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, maxLength: 1024, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/activate:
    post:
      security: []
      operationId: activateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code: { type: string, writeOnly: true }
                password: { type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/session:
    get:
      operationId: currentSession
      responses:
        "200":
          description: Current user and session
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Owned sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      operationId: changePassword
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password, writeOnly: true }
                new_password: { type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getProfile
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProfile
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                current_password: { type: string, format: password, writeOnly: true, description: Required when email changes }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      operationId: listUsers
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/UserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, display_name, role, grants]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                role: { type: string, enum: [admin, member] }
                grants: { $ref: "#/components/schemas/Grants" }
      responses:
        "201":
          description: User and one-time activation code
          content:
            application/json:
              schema:
                type: object
                required: [user, activation_code]
                properties:
                  user: { $ref: "#/components/schemas/ManagedUser" }
                  activation_code: { type: string, writeOnly: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{id}:
    get:
      operationId: getUser
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/ManagedUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200": { $ref: "#/components/responses/ManagedUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{id}/{purpose}-code:
    post:
      operationId: issueUserCode
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: purpose, in: path, required: true, schema: { type: string, enum: [activation, recovery] } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "201":
          description: One-time 24-hour code
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, writeOnly: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{id}/grants:
    put:
      operationId: updateUserGrants
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Grants" }
      responses:
        "200": { $ref: "#/components/responses/ManagedUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/owner/transfer:
    post:
      operationId: transferOwner
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, revision]
              properties:
                user_id: { type: string }
                revision: { type: integer, minimum: 1 }
      responses:
        "204": { description: Ownership transferred; both users signed out }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /keys:
    get:
      operationId: listKeys
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/KeyPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createKey
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { $ref: "#/components/requestBodies/KeyInput" }
      responses:
        "201": { $ref: "#/components/responses/KeySecret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}:
    get:
      operationId: getKey
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Key" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateKey
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody: { $ref: "#/components/requestBodies/KeyInput" }
      responses:
        "200": { $ref: "#/components/responses/Key" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeKey
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Key and all secrets revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}/rotate:
    post:
      operationId: rotateKey
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200": { $ref: "#/components/responses/KeySecret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /providers:
    get:
      operationId: listProviderTypes
      responses:
        "200": { description: Supported adapters and capabilities, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { type: object, required: [id, capabilities], properties: { id: { type: string }, capabilities: { type: array, items: { type: string } } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /provider-presets:
    get:
      operationId: listProviderPresets
      responses:
        "200": { description: Built-in provider connection presets, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ProviderPreset" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /connections:
    get:
      operationId: listProviderConnections
      responses:
        "200": { description: Provider connections, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ProviderConnection" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProviderConnection
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderConnectionInput" } } } }
      responses:
        "201": { description: Connection created, content: { application/json: { schema: { type: object, required: [connection], properties: { connection: { $ref: "#/components/schemas/ProviderConnection" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Error" }
  /connections/{id}:
    get:
      operationId: getProviderConnection
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Provider connection, content: { application/json: { schema: { type: object, required: [connection], properties: { connection: { $ref: "#/components/schemas/ProviderConnection" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProviderConnection
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/Revision" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderConnectionInput" } } } }
      responses:
        "200": { description: Connection updated, content: { application/json: { schema: { type: object, required: [connection], properties: { connection: { $ref: "#/components/schemas/ProviderConnection" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Error" }
  /connections/{id}/credential:
    put:
      operationId: replaceProviderCredential
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { credential: { type: string, writeOnly: true, maxLength: 16384 }, external_ref: { type: string, pattern: '^env:[A-Za-z_][A-Za-z0-9_]*$', writeOnly: true } } } } }
      responses:
        "204": { description: Credential replaced }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Error" }
  /connections/{id}/models:
    get:
      operationId: listUpstreamModels
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Upstream models, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/UpstreamModel" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
