openapi: 3.1.0
info:
  title: Pocket AI Gateway Management API
  version: 0.5.0
  description: Implemented identity, limits, usage, pricing, provider, model, and request-history management surface. Compatible inference APIs have separate protocol specifications.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/setup/status:
    get:
      security: []
      operationId: setupStatus
      responses:
        "200":
          description: Safe setup state
          content:
            application/json:
              schema:
                type: object
                required: [setup_required, setup_recovery_available]
                properties:
                  setup_required: { type: boolean }
                  setup_recovery_available: { type: boolean }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/setup/claim:
    post:
      security: []
      operationId: claimOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerClaim" }
      responses:
        "201": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, maxLength: 1024, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/activate:
    post:
      security: []
      operationId: activateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code: { type: string, writeOnly: true }
                password: { type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/session:
    get:
      operationId: currentSession
      responses:
        "200":
          description: Current user and session
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Owned sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      operationId: changePassword
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password, writeOnly: true }
                new_password: { type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getProfile
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProfile
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                current_password: { type: string, format: password, writeOnly: true, description: Required when email changes }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      operationId: listUsers
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/UserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, display_name, role, grants]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                role: { type: string, enum: [admin, member] }
                grants: { $ref: "#/components/schemas/Grants" }
      responses:
        "201":
          description: User and one-time activation code
          content:
            application/json:
              schema:
                type: object
                required: [user, activation_code]
                properties:
                  user: { $ref: "#/components/schemas/ManagedUser" }
                  activation_code: { type: string, writeOnly: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{id}:
    get:
      operationId: getUser
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/ManagedUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200": { $ref: "#/components/responses/ManagedUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{id}/{purpose}-code:
    post:
      operationId: issueUserCode
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: purpose, in: path, required: true, schema: { type: string, enum: [activation, recovery] } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "201":
          description: One-time 24-hour code
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, writeOnly: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users/{id}/grants:
    put:
      operationId: updateUserGrants
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Grants" }
      responses:
        "200": { $ref: "#/components/responses/ManagedUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/owner/transfer:
    post:
      operationId: transferOwner
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, revision]
              properties:
                user_id: { type: string }
                revision: { type: integer, minimum: 1 }
      responses:
        "204": { description: Ownership transferred; both users signed out }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /keys:
    get:
      operationId: listKeys
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/KeyPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createKey
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { $ref: "#/components/requestBodies/KeyInput" }
      responses:
        "201": { $ref: "#/components/responses/KeySecret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}:
    get:
      operationId: getKey
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Key" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateKey
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody: { $ref: "#/components/requestBodies/KeyInput" }
      responses:
        "200": { $ref: "#/components/responses/Key" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeKey
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Key and all secrets revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}/rotate:
    post:
      operationId: rotateKey
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200": { $ref: "#/components/responses/KeySecret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/policies:
    get:
      operationId: listLimitPolicies
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Role-scoped limit policies
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { data: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/LimitPolicy" } } } }] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createLimitPolicy
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LimitPolicyInput" } } }
      responses:
        "201": { description: Policy created, content: { application/json: { schema: { type: object, required: [policy], properties: { policy: { $ref: "#/components/schemas/LimitPolicy" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/policies/{id}:
    patch:
      operationId: updateLimitPolicy
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Revision" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [limit_units, limit_usd, enabled]
              properties:
                limit_units: { type: integer, minimum: 1, maximum: 9007199254740991 }
                limit_usd: { type: string }
                enabled: { type: boolean }
      responses:
        "200": { description: Policy updated, content: { application/json: { schema: { type: object, required: [policy], properties: { policy: { $ref: "#/components/schemas/LimitPolicy" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /keys/{id}/effective-limits:
    get:
      operationId: effectiveKeyLimits
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: connection_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Intersected effective limit state, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/EffectiveLimit" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /usage:
    get:
      operationId: usageSummary
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: key_id, in: query, schema: { type: string } }
        - { name: model_id, in: query, schema: { type: string } }
        - { name: connection_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Role-scoped usage summary, content: { application/json: { schema: { type: object, required: [usage], properties: { usage: { $ref: "#/components/schemas/UsageSummary" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /usage/unresolved:
    get:
      operationId: unresolvedUsage
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: key_id, in: query, schema: { type: string } }
        - { name: model_id, in: query, schema: { type: string } }
        - { name: connection_id, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Attempts with unknown or uncertain accounting, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { data: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/UnresolvedAttempt" } } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /requests:
    get:
      operationId: listRequests
      description: Lists the current user's requests. Administrators may filter by user_id; members may only query their own user_id. Results are ordered newest first and paginated with an opaque cursor at 50 records per page.
      parameters:
        - { name: user_id, in: query, schema: { type: string }, description: Administrator-only owner filter }
        - { name: key_id, in: query, schema: { type: string } }
        - { name: model_id, in: query, schema: { type: string } }
        - { name: dialect, in: query, schema: { type: string, enum: [openai, responses, anthropic, gemini] } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Visible request history with all attempts
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, has_more]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RequestRecord" } }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/usage/outbox:
    get:
      operationId: usageOutboxStatus
      responses:
        "200": { description: Durable projection backlog, content: { application/json: { schema: { type: object, required: [outbox], properties: { outbox: { $ref: "#/components/schemas/OutboxStatus" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/prices:
    get:
      operationId: listPrices
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200": { description: Effective-dated prices, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { data: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/PriceVersion" } } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPrice
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceInput" } } }
      responses:
        "201": { description: Price version created, content: { application/json: { schema: { type: object, required: [price], properties: { price: { $ref: "#/components/schemas/PriceVersion" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/usage/reprice-preview:
    post:
      operationId: previewUsageRepricing
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RepricePreviewInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RepricePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/usage/reprice:
    post:
      operationId: applyUsageRepricing
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RepriceApplyInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RepriceApplied" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/usage/reconciliations:
    post:
      operationId: reconcileUnknownUsage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_id, input_tokens, output_tokens, usage_status, reason, idempotency_key]
              properties:
                attempt_id: { type: string }
                input_tokens: { type: integer, minimum: 0, maximum: 9007199254740991 }
                output_tokens: { type: integer, minimum: 0, maximum: 9007199254740991 }
                cost_usd: { type: string }
                usage_status: { type: string, enum: [provider_reported, estimated] }
                reason: { type: string, minLength: 3, maxLength: 500 }
                idempotency_key: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { description: Unknown attempt reconciled, content: { application/json: { schema: { type: object, required: [reconciled], properties: { reconciled: { type: boolean, const: true } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/usage/adjustments:
    post:
      operationId: adjustUsageCost
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_id, delta_usd, reason, idempotency_key]
              properties:
                attempt_id: { type: string }
                delta_usd: { type: string }
                reason: { type: string, minLength: 3, maxLength: 500 }
                idempotency_key: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { description: Restated cost, content: { application/json: { schema: { type: object, required: [restated_cost_usd], properties: { restated_cost_usd: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: pocket_ai_gateway_session }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string } }
    CSRF: { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Must equal the readable strict SameSite CSRF cookie }
    Revision: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
  requestBodies:
    KeyInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KeyInput" }
  responses:
    Error:
      description: Unexpected management API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication failed or is required
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The request is not permitted or could not be verified
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Resource state conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayloadTooLarge:
      description: Request body exceeds 64 KiB
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PreconditionRequired:
      description: A current revision is required in If-Match
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Too many authentication attempts
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: Required storage is unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    User:
      description: User resource
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/User" }
    UserPage:
      description: Role-scoped user page
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Page" }
              - type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ManagedUser" } }
    ManagedUser:
      description: Revisioned administrative user resource
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/ManagedUser" }
    Key:
      description: API key without secret
      content:
        application/json:
          schema:
            type: object
            required: [key]
            properties:
              key: { $ref: "#/components/schemas/APIKey" }
    KeySecret:
      description: API key plus one-time secret
      content:
        application/json:
          schema:
            type: object
            required: [key, secret]
            properties:
              key: { $ref: "#/components/schemas/APIKey" }
              secret: { type: string, writeOnly: true }
    KeyPage:
      description: Owned API-key page
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Page" }
              - type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    RepricePreview:
      description: Repricing preview
      content:
        application/json:
          schema:
            type: object
            required: [preview]
            properties:
              preview: { $ref: "#/components/schemas/RepriceResult" }
    RepriceApplied:
      description: Applied repricing result
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result: { $ref: "#/components/schemas/RepriceResult" }
  schemas:
    OwnerClaim:
      type: object
      additionalProperties: false
      required: [setup_code, email, display_name, password]
      properties:
        setup_code: { type: string, writeOnly: true }
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true }
    User:
      type: object
      required: [id, email, display_name, role, status, grants]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [active, suspended, pending_activation, archived] }
        grants: { $ref: "#/components/schemas/Grants" }
    ManagedUser:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          required: [revision, created_at, updated_at, grants]
          properties:
            revision: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            grants: { $ref: "#/components/schemas/Grants" }
    Grants:
      type: object
      additionalProperties: false
      required: [unrestricted, scopes, model_patterns, connection_ids]
      properties:
        unrestricted: { type: boolean, description: Read-only true for the owner; user writes are forced false }
        scopes: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, enum: [chat:generate, responses:generate, embeddings:generate, models:read, tokens:count] } }
        model_patterns: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        connection_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
    Session:
      type: object
      required: [id, current, created_at, last_seen_at, expires_at, authenticated_at, user_agent]
      properties:
        id: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        authenticated_at: { type: string, format: date-time }
        user_agent: { type: string }
    KeyInput:
      type: object
      additionalProperties: false
      required: [label, scopes, model_patterns, connection_ids, expires_at]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, enum: [active, disabled] }
        scopes: { type: array, uniqueItems: true, items: { type: string, enum: [chat:generate, responses:generate, embeddings:generate, models:read, tokens:count] } }
        model_patterns: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        connection_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        expires_at: { oneOf: [{ type: string, format: date-time }, { type: string, maxLength: 0 }] }
    APIKey:
      type: object
      required: [id, label, state, scopes, model_patterns, connection_ids, expires_at, revision, created_at, updated_at]
      properties:
        id: { type: string }
        label: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, enum: [active, disabled, revoked] }
        scopes: { type: array, uniqueItems: true, items: { type: string } }
        model_patterns: { type: array, uniqueItems: true, items: { type: string } }
        connection_ids: { type: array, uniqueItems: true, items: { type: string } }
        expires_at: { type: [string, "null"], format: date-time }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Page:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
    LimitPolicyInput:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_id, metric, algorithm, period, window_seconds, limit_units, limit_usd, refill_units, refill_interval_ms]
      properties:
        scope_kind: { type: string, enum: [instance, user, key, connection] }
        scope_id: { type: string }
        metric: { type: string, enum: [requests, tokens, spend, concurrency, body_bytes, output_tokens, batch_items] }
        algorithm: { type: string, enum: [token_bucket, fixed_window, quota, concurrency, ceiling] }
        period: { type: string, enum: ["", hour, day, week, month, lifetime] }
        window_seconds: { type: integer, minimum: 0, maximum: 9007199254740991 }
        limit_units: { type: integer, minimum: 1, maximum: 9007199254740991 }
        limit_usd: { type: string }
        refill_units: { type: integer, minimum: 0, maximum: 9007199254740991 }
        refill_interval_ms: { type: integer, minimum: 0, maximum: 9007199254740991 }
        enabled: { type: boolean, default: true }
    LimitPolicy:
      type: object
      required: [id, scope_kind, scope_id, metric, algorithm, period, window_seconds, limit_units, refill_units, refill_interval_ms, enabled, revision, created_at, updated_at]
      properties:
        id: { type: string }
        scope_kind: { type: string, enum: [instance, user, key, connection] }
        scope_id: { type: string }
        metric: { type: string, enum: [requests, tokens, spend, concurrency, body_bytes, output_tokens, batch_items] }
        algorithm: { type: string, enum: [token_bucket, fixed_window, quota, concurrency, ceiling] }
        period: { type: string, enum: ["", hour, day, week, month, lifetime] }
        window_seconds: { type: integer, minimum: 0, maximum: 9007199254740991 }
        limit_units: { type: integer, minimum: 1, maximum: 9007199254740991 }
        limit_usd: { type: string }
        refill_units: { type: integer, minimum: 0, maximum: 9007199254740991 }
        refill_interval_ms: { type: integer, minimum: 0, maximum: 9007199254740991 }
        enabled: { type: boolean }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EffectiveLimit:
      type: object
      required: [policy_id, scope_kind, metric, algorithm, period, limit_units, consumed_units, reserved_units, remaining_units]
      properties:
        policy_id: { type: string }
        scope_kind: { type: string }
        metric: { type: string }
        algorithm: { type: string }
        period: { type: string }
        limit_units: { type: integer }
        limit_usd: { type: string }
        consumed_units: { type: integer }
        consumed_usd: { type: string }
        reserved_units: { type: integer }
        reserved_usd: { type: string }
        remaining_units: { type: integer }
        remaining_usd: { type: string }
        resets_at: { type: [string, "null"], format: date-time }
    UsagePoint:
      type: object
      required: [date, requests, input_tokens, output_tokens, known_cost_usd, unknown_attempts]
      properties:
        date: { type: string, format: date }
        requests: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        known_cost_usd: { type: string }
        unknown_attempts: { type: integer }
    UsageSummary:
      type: object
      required: [from, to, requests, attempts, input_tokens, output_tokens, known_cost_usd, estimated_cost_usd, as_recorded_cost_usd, restatement_delta_usd, unknown_attempts, points]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        requests: { type: integer }
        attempts: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        known_cost_usd: { type: string }
        estimated_cost_usd: { type: string }
        as_recorded_cost_usd: { type: string }
        restatement_delta_usd: { type: string }
        unknown_attempts: { type: integer }
        points: { type: array, items: { $ref: "#/components/schemas/UsagePoint" } }
    UnresolvedAttempt:
      type: object
      required: [id, request_id, owner_user_id, key_id, model_id, connection_id, state, usage_status, started_at]
      properties:
        id: { type: string }
        request_id: { type: string }
        owner_user_id: { type: string }
        key_id: { type: string }
        model_id: { type: string }
        connection_id: { type: string }
        state: { type: string }
        usage_status: { type: string }
        estimated_cost_usd: { type: string }
        started_at: { type: string, format: date-time }
    RequestAttempt:
      type: object
      required: [id, ordinal, connection_id, model_id, upstream_model_id, target_dialect, target_operation, translation_applied, request_tool_count, response_tool_call_count, tool_call_status, state, usage_status, input_tokens, output_tokens, cost_usd, started_at]
      properties:
        id: { type: string }
        ordinal: { type: integer, minimum: 1 }
        connection_id: { type: string }
        model_id: { type: string }
        upstream_model_id: { type: string }
        target_dialect: { type: string }
        target_operation: { type: string }
        translation_applied: { type: boolean }
        request_tool_count: { type: integer, minimum: 0 }
        response_tool_call_count: { type: integer, minimum: 0 }
        tool_call_status: { type: string, enum: [none, completed, incomplete] }
        state: { type: string, enum: [reserved, dispatching, streaming, succeeded, failed, cancelled_before_dispatch, cancelled, interrupted_unknown] }
        usage_status: { type: string, enum: [pending, provider_reported, estimated, unknown] }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
    RequestRecord:
      type: object
      required: [id, owner_user_id, key_id, operation, dialect, model_id, state, started_at, finished_at, attempts]
      properties:
        id: { type: string }
        owner_user_id: { type: string }
        key_id: { type: string }
        operation: { type: string }
        dialect: { type: string, enum: [openai, responses, anthropic, gemini] }
        model_id: { type: string }
        state: { type: string, enum: [reserved, in_progress, succeeded, failed, cancelled, interrupted_unknown] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        attempts: { type: array, items: { $ref: "#/components/schemas/RequestAttempt" } }
    OutboxStatus:
      type: object
      required: [pending_events, reserved_events, pending_bytes, oldest_event_at, full]
      properties:
        pending_events: { type: integer }
        reserved_events: { type: integer }
        pending_bytes: { type: integer }
        oldest_event_at: { type: [string, "null"], format: date-time }
        full: { type: boolean }
    PriceInput:
      type: object
      additionalProperties: false
      required: [connection_id, model_id, input_usd_per_million, output_usd_per_million, source, effective_from, effective_to]
      properties:
        connection_id: { type: string }
        model_id: { type: string }
        input_usd_per_million: { type: string }
        output_usd_per_million: { type: string }
        source: { type: string, minLength: 1, maxLength: 500 }
        effective_from: { type: string, format: date-time }
        effective_to: { oneOf: [{ type: string, format: date-time }, { type: string, maxLength: 0 }] }
    PriceVersion:
      type: object
      required: [id, connection_id, model_id, input_usd_per_million, output_usd_per_million, source, effective_from, effective_to, created_at]
      properties:
        id: { type: string }
        connection_id: { type: string }
        model_id: { type: string }
        input_usd_per_million: { type: string }
