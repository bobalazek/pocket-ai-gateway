        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createBackup
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "201": { description: Encrypted backup created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/retention:
    post:
      operationId: runRetention
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Deleted record counts }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/audit:
    get:
      operationId: listAuditEvents
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: actor_user_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Filtered local audit events, content: { application/json: { schema: { type: object, required: [data, next_cursor, has_more], properties: { data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }, next_cursor: { type: string }, has_more: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        "200": { description: Safe local runtime diagnostics }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/config/export:
    get:
      operationId: exportConfiguration
      responses:
        "200": { description: Portable non-secret configuration document }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/config/preview:
    post:
      operationId: previewConfigurationImport
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Validated import counts and warnings }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /admin/config/import:
    post:
      operationId: importConfiguration
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Configuration applied transactionally }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: pocket_ai_gateway_session }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string } }
    CSRF: { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Must equal the readable strict SameSite CSRF cookie }
    Revision: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
  requestBodies:
    KeyInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KeyInput" }
  responses:
    Error:
      description: Unexpected management API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication failed or is required
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The request is not permitted or could not be verified
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Resource state conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayloadTooLarge:
      description: Request body exceeds 64 KiB
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PreconditionRequired:
      description: A current revision is required in If-Match
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Too many authentication attempts
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: Required storage is unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    User:
      description: User resource
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/User" }
    UserPage:
      description: Role-scoped user page
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Page" }
              - type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ManagedUser" } }
    ManagedUser:
      description: Revisioned administrative user resource
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/ManagedUser" }
    Key:
      description: API key without secret
      content:
        application/json:
          schema:
            type: object
            required: [key]
            properties:
              key: { $ref: "#/components/schemas/APIKey" }
    KeySecret:
      description: API key plus one-time secret
      content:
        application/json:
          schema:
            type: object
            required: [key, secret]
            properties:
              key: { $ref: "#/components/schemas/APIKey" }
              secret: { type: string, writeOnly: true }
    KeyPage:
      description: Owned API-key page
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Page" }
              - type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    RepricePreview:
      description: Repricing preview
      content:
        application/json:
          schema:
            type: object
            required: [preview]
            properties:
              preview: { $ref: "#/components/schemas/RepriceResult" }
    RepriceApplied:
      description: Applied repricing result
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result: { $ref: "#/components/schemas/RepriceResult" }
  schemas:
    OperationSettings:
      type: object
      additionalProperties: false
      required: [backup_enabled, backup_interval_hours, backup_retention_count, backup_destination, local_directory, s3_endpoint, s3_region, s3_bucket, s3_prefix, s3_access_key_env, s3_secret_key_env, request_retention_days, audit_retention_days]
      properties:
        backup_enabled: { type: boolean }
        backup_interval_hours: { type: integer, minimum: 1, maximum: 720 }
        backup_retention_count: { type: integer, minimum: 1, maximum: 365 }
        backup_destination: { type: string, enum: [local, s3] }
        local_directory: { type: string }
        s3_endpoint: { type: string }
        s3_region: { type: string }
        s3_bucket: { type: string }
        s3_prefix: { type: string }
        s3_access_key_env: { type: string }
        s3_secret_key_env: { type: string }
        request_retention_days: { type: integer, minimum: 1, maximum: 3650 }
        audit_retention_days: { type: integer, minimum: 30, maximum: 3650 }
        revision: { type: integer, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        backup_key_configured: { type: boolean, readOnly: true }
    BackupJob:
      type: object
      required: [id, state, destination, archive_name, checksum, size_bytes, snapshot_generation, error, started_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [running, succeeded, failed] }
        destination: { type: string, enum: [local, s3] }
        archive_name: { type: string }
        checksum: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        snapshot_generation: { type: string }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, resource_type, resource_id, detail_json, created_at]
      properties:
        id: { type: string }
        actor_user_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        detail_json: { type: string, description: Redacted structured audit detail }
        created_at: { type: string, format: date-time }
    ProviderPreset:
      type: object
      required: [id, label, adapter, base_url, credential_required, private_network]
      properties:
        id: { type: string, enum: [openai, anthropic, gemini, openrouter, ollama] }
        label: { type: string }
        adapter: { type: string, enum: [openai, anthropic, gemini, openai_compatible] }
        base_url: { type: string, format: uri }
        credential_required: { type: boolean }
        private_network: { type: boolean }
    ProviderConnectionInput:
      type: object
      additionalProperties: false
      required: [name, enabled, timeout_ms]
      oneOf:
        - required: [adapter, base_url, allow_private_network]
          properties:
            preset: { type: string, enum: [custom], default: custom }
        - required: [preset]
          properties:
            preset: { type: string, enum: [openai, anthropic, gemini, openrouter, ollama] }
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        adapter: { type: string, enum: [openai, anthropic, gemini, openai_compatible] }
        base_url: { type: string, format: uri }
        enabled: { type: boolean }
        allow_private_network: { type: boolean }
        timeout_ms: { type: integer, minimum: 1000, maximum: 600000 }
        preset: { type: string, enum: [custom, openai, anthropic, gemini, openrouter, ollama], default: custom }
    ProviderConnection:
      allOf:
        - { $ref: "#/components/schemas/ProviderConnectionInput" }
        - type: object
          required: [id, preset, credential_state, revision, created_at, updated_at]
          properties:
            id: { type: string }
            credential_state: { type: string, enum: [missing, stored, external] }
            revision: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    UpstreamModel:
      type: object
      required: [id, connection_id, upstream_id, capabilities, active]
      properties:
        id: { type: string }
        connection_id: { type: string }
        upstream_id: { type: string }
        capabilities: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [chat, embeddings, count_tokens] } }
        active: { type: boolean }
    VisibleModel:
      type: object
      required: [id, label, description, adapter, capabilities]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        adapter: { type: string }
        capabilities: { type: array, items: { type: string } }
    PublicModelInput:
      type: object
      additionalProperties: false
      required: [id, label, description, target_model_id, capabilities]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$' }
        label: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        target_model_id: { type: string }
        capabilities: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [chat, embeddings, count_tokens] } }
    PublicModel:
      allOf:
        - { $ref: "#/components/schemas/VisibleModel" }
        - type: object
          required: [target_connection_id, target_model_id, upstream_id, active, revision, routing_strategy, free_only]
          properties:
            target_connection_id: { type: string }
            target_model_id: { type: string }
            upstream_id: { type: string }
            active: { type: boolean }
            revision: { type: integer, minimum: 1 }
            routing_strategy: { $ref: "#/components/schemas/RouteStrategy" }
            free_only: { type: boolean }
    RouteStrategy: { type: string, enum: [fixed, ordered_fallback, weighted, lowest_cost, lowest_latency] }
    RouteTargetInput:
      type: object
      additionalProperties: false
      required: [upstream_model_id, priority, weight, enabled]
      properties:
        upstream_model_id: { type: string }
        priority: { type: integer, minimum: 1, maximum: 1000 }
        weight: { type: integer, minimum: 1, maximum: 10000 }
        enabled: { type: boolean }
    RouteConfigInput:
      type: object
      additionalProperties: false
      required: [strategy, free_only, targets]
      description: Fixed routes accept exactly one enabled target. Public models with embedding capability also require fixed routing to preserve vector compatibility. Free-only routes require a manager-recorded zero price verified within 24 hours.
      allOf:
        - if:
            properties:
              strategy: { const: fixed }
          then:
            properties:
              targets: { maxItems: 1 }
      properties:
        strategy: { $ref: "#/components/schemas/RouteStrategy" }
        free_only: { type: boolean }
        targets: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/RouteTargetInput" } }
    RoutePreviewInput:
      type: object
      additionalProperties: false
      required: [operation, streaming, estimated_input_tokens, estimated_output_tokens]
      properties:
        operation: { type: string, minLength: 1 }
        streaming: { type: boolean }
        estimated_input_tokens: { type: integer, minimum: 0 }
        estimated_output_tokens: { type: integer, minimum: 0 }
    RoutePlan:
      type: object
      required: [model_id, strategy, free_only, selection_reason, targets, rejected]
      properties:
        model_id: { type: string }
        strategy: { $ref: "#/components/schemas/RouteStrategy" }
        free_only: { type: boolean }
        selection_reason: { type: string }
        targets: { type: array, items: { type: object, required: [upstream_model_id, connection_id, upstream_id, adapter, priority, weight, sample_count], properties: { upstream_model_id: { type: string }, connection_id: { type: string }, upstream_id: { type: string }, adapter: { type: string }, priority: { type: integer }, weight: { type: integer }, sample_count: { type: integer }, estimated_cost_usd: { type: string }, latency_ms: { type: integer }, circuit_open_until: { type: string, format: date-time } } } }
        rejected: { type: array, items: { $ref: "#/components/schemas/RouteRejection" } }
    RouteRejection:
      type: object
      required: [upstream_model_id, connection_id, reason]
      properties:
        upstream_model_id: { type: string }
        connection_id: { type: string }
        reason: { type: string, enum: [connection_not_granted, unsupported_capability, translation_unsupported, request_translation_unsupported, anthropic_stream_usage_unavailable, credential_unavailable, not_verified_free, circuit_open, price_unknown] }
    CatalogConfigInput:
      type: object
      additionalProperties: false
      required: [source_url, refresh_enabled, refresh_interval_hours]
      properties:
        source_url:
          description: HTTPS github.com or raw.githubusercontent.com JSON URL; empty disables a source
          oneOf:
            - { type: string, const: "" }
            - { type: string, format: uri, pattern: '^https://(github\\.com|raw\\.githubusercontent\\.com)/' }
        refresh_enabled: { type: boolean, default: false }
        refresh_interval_hours: { type: integer, minimum: 1, maximum: 720 }
    CatalogState:
      type: object
      required: [source_url, source_version, last_checked_at, last_error, refresh_enabled, refresh_interval_hours]
      properties:
        source_url: { type: string }
        source_version: { type: string }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        refresh_enabled: { type: boolean }
        refresh_interval_hours: { type: integer }
    CatalogCandidate:
      type: object
      required: [provider, model_id, label, capabilities, free, source, source_version, discovered_at]
      properties:
        provider: { type: string }
        model_id: { type: string }
        label: { type: string }
        capabilities: { type: array, items: { type: string } }
        input_nanos_per_million: { type: integer, minimum: 0 }
        output_nanos_per_million: { type: integer, minimum: 0 }
        free: { type: boolean }
        source: { type: string }
        source_version: { type: string }
        discovered_at: { type: string, format: date-time }
    OwnerClaim:
      type: object
      additionalProperties: false
      required: [setup_code, email, display_name, password]
      properties:
        setup_code: { type: string, writeOnly: true }
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true }
    User:
      type: object
      required: [id, email, display_name, role, status, grants]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [active, suspended, pending_activation, archived] }
        grants: { $ref: "#/components/schemas/Grants" }
    ManagedUser:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          required: [revision, created_at, updated_at, grants]
          properties:
            revision: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            grants: { $ref: "#/components/schemas/Grants" }
    Grants:
      type: object
      additionalProperties: false
      required: [unrestricted, scopes, model_patterns, connection_ids]
      properties:
        unrestricted: { type: boolean, description: Read-only true for the owner; user writes are forced false }
        scopes: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, enum: [chat:generate, responses:generate, embeddings:generate, models:read, tokens:count] } }
        model_patterns: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        connection_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
    Session:
      type: object
      required: [id, current, created_at, last_seen_at, expires_at, authenticated_at, user_agent]
      properties:
        id: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        authenticated_at: { type: string, format: date-time }
        user_agent: { type: string }
    KeyInput:
      type: object
      additionalProperties: false
      required: [label, scopes, model_patterns, connection_ids, expires_at]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, enum: [active, disabled] }
        scopes: { type: array, uniqueItems: true, items: { type: string, enum: [chat:generate, responses:generate, embeddings:generate, models:read, tokens:count] } }
        model_patterns: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        connection_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        expires_at: { oneOf: [{ type: string, format: date-time }, { type: string, maxLength: 0 }] }
    APIKey:
      type: object
      required: [id, label, state, scopes, model_patterns, connection_ids, expires_at, revision, created_at, updated_at]
      properties:
        id: { type: string }
        label: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, enum: [active, disabled, revoked] }
        scopes: { type: array, uniqueItems: true, items: { type: string } }
        model_patterns: { type: array, uniqueItems: true, items: { type: string } }
        connection_ids: { type: array, uniqueItems: true, items: { type: string } }
        expires_at: { type: [string, "null"], format: date-time }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Page:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
    LimitPolicyInput:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_id, metric, algorithm, period, window_seconds, limit_units, limit_usd, refill_units, refill_interval_ms]
      properties:
        scope_kind: { type: string, enum: [instance, user, key, connection] }
        scope_id: { type: string }
        metric: { type: string, enum: [requests, tokens, spend, concurrency, body_bytes, output_tokens, batch_items] }
        algorithm: { type: string, enum: [token_bucket, fixed_window, quota, concurrency, ceiling] }
        period: { type: string, enum: ["", hour, day, week, month, lifetime] }
        window_seconds: { type: integer, minimum: 0, maximum: 9007199254740991 }
        limit_units: { type: integer, minimum: 1, maximum: 9007199254740991 }
        limit_usd: { type: string }
        refill_units: { type: integer, minimum: 0, maximum: 9007199254740991 }
        refill_interval_ms: { type: integer, minimum: 0, maximum: 9007199254740991 }
        enabled: { type: boolean, default: true }
    LimitPolicy:
      type: object
      required: [id, scope_kind, scope_id, metric, algorithm, period, window_seconds, limit_units, refill_units, refill_interval_ms, enabled, revision, created_at, updated_at]
      properties:
        id: { type: string }
        scope_kind: { type: string, enum: [instance, user, key, connection] }
        scope_id: { type: string }
        metric: { type: string, enum: [requests, tokens, spend, concurrency, body_bytes, output_tokens, batch_items] }
        algorithm: { type: string, enum: [token_bucket, fixed_window, quota, concurrency, ceiling] }
        period: { type: string, enum: ["", hour, day, week, month, lifetime] }
        window_seconds: { type: integer, minimum: 0, maximum: 9007199254740991 }
        limit_units: { type: integer, minimum: 1, maximum: 9007199254740991 }
        limit_usd: { type: string }
        refill_units: { type: integer, minimum: 0, maximum: 9007199254740991 }
        refill_interval_ms: { type: integer, minimum: 0, maximum: 9007199254740991 }
        enabled: { type: boolean }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EffectiveLimit:
      type: object
      required: [policy_id, scope_kind, metric, algorithm, period, limit_units, consumed_units, reserved_units, remaining_units]
      properties:
        policy_id: { type: string }
        scope_kind: { type: string }
        metric: { type: string }
        algorithm: { type: string }
        period: { type: string }
        limit_units: { type: integer }
        limit_usd: { type: string }
        consumed_units: { type: integer }
        consumed_usd: { type: string }
        reserved_units: { type: integer }
        reserved_usd: { type: string }
        remaining_units: { type: integer }
        remaining_usd: { type: string }
        resets_at: { type: [string, "null"], format: date-time }
    UsagePoint:
      type: object
      required: [date, requests, input_tokens, output_tokens, known_cost_usd, unknown_attempts]
      properties:
        date: { type: string, format: date }
        requests: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        known_cost_usd: { type: string }
        unknown_attempts: { type: integer }
    UsageSummary:
      type: object
      required: [from, to, requests, attempts, input_tokens, output_tokens, known_cost_usd, estimated_cost_usd, as_recorded_cost_usd, restatement_delta_usd, unknown_attempts, points]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        requests: { type: integer }
        attempts: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        known_cost_usd: { type: string }
        estimated_cost_usd: { type: string }
        as_recorded_cost_usd: { type: string }
        restatement_delta_usd: { type: string }
        unknown_attempts: { type: integer }
        points: { type: array, items: { $ref: "#/components/schemas/UsagePoint" } }
    UnresolvedAttempt:
      type: object
      required: [id, request_id, owner_user_id, key_id, model_id, connection_id, state, usage_status, started_at]
      properties:
        id: { type: string }
        request_id: { type: string }
        owner_user_id: { type: string }
        key_id: { type: string }
        model_id: { type: string }
        connection_id: { type: string }
        state: { type: string }
        usage_status: { type: string }
        estimated_cost_usd: { type: string }
        started_at: { type: string, format: date-time }
    RequestAttempt:
      type: object
      required: [id, ordinal, connection_id, model_id, upstream_model_id, target_dialect, target_operation, translation_applied, request_tool_count, response_tool_call_count, tool_call_status, selection_reason, rejected_candidates, state, usage_status, input_tokens, output_tokens, cost_usd, started_at]
      properties:
        id: { type: string }
        ordinal: { type: integer, minimum: 1 }
        connection_id: { type: string }
        model_id: { type: string }
        upstream_model_id: { type: string }
        target_dialect: { type: string }
        target_operation: { type: string }
        translation_applied: { type: boolean }
        request_tool_count: { type: integer, minimum: 0 }
        response_tool_call_count: { type: integer, minimum: 0 }
        tool_call_status: { type: string, enum: [none, completed, incomplete] }
        selection_reason: { type: string }
        rejected_candidates: { type: array, items: { $ref: "#/components/schemas/RouteRejection" } }
        state: { type: string, enum: [reserved, dispatching, streaming, succeeded, failed, cancelled_before_dispatch, cancelled, interrupted_unknown] }
        usage_status: { type: string, enum: [pending, provider_reported, estimated, unknown] }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
    RequestRecord:
      type: object
      required: [id, owner_user_id, key_id, operation, dialect, model_id, state, started_at, finished_at, attempts]
      properties:
        id: { type: string }
        owner_user_id: { type: string }
        key_id: { type: string }
        operation: { type: string }
        dialect: { type: string, enum: [openai, responses, anthropic, gemini] }
        model_id: { type: string }
        state: { type: string, enum: [reserved, in_progress, succeeded, failed, cancelled, interrupted_unknown] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        attempts: { type: array, items: { $ref: "#/components/schemas/RequestAttempt" } }
    OutboxStatus:
      type: object
      required: [pending_events, reserved_events, pending_bytes, oldest_event_at, full]
      properties:
        pending_events: { type: integer }
        reserved_events: { type: integer }
        pending_bytes: { type: integer }
        oldest_event_at: { type: [string, "null"], format: date-time }
        full: { type: boolean }
    PriceInput:
      type: object
      additionalProperties: false
      required: [connection_id, model_id, input_usd_per_million, output_usd_per_million, source, effective_from, effective_to]
      properties:
        connection_id: { type: string }
        model_id: { type: string }
        input_usd_per_million: { type: string }
        output_usd_per_million: { type: string }
        source: { type: string, minLength: 1, maxLength: 500 }
        effective_from: { type: string, format: date-time }
        effective_to: { oneOf: [{ type: string, format: date-time }, { type: string, maxLength: 0 }] }
    PriceVersion:
      type: object
      required: [id, connection_id, model_id, input_usd_per_million, output_usd_per_million, source, effective_from, effective_to, created_at]
      properties:
        id: { type: string }
        connection_id: { type: string }
        model_id: { type: string }
        input_usd_per_million: { type: string }
        output_usd_per_million: { type: string }
        source: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    RepricePreviewInput:
      type: object
      additionalProperties: false
      required: [connection_id, model_id, from, to]
      properties:
        connection_id: { type: string }
        model_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    RepriceApplyInput:
      type: object
      additionalProperties: false
      required: [connection_id, model_id, from, to, idempotency_key]
      properties:
        connection_id: { type: string }
        model_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        idempotency_key: { type: string, minLength: 1, maxLength: 200 }
    RepriceResult:
      type: object
      required: [affected_attempts, missing_prices, delta_usd]
      properties:
        affected_attempts: { type: integer }
        missing_prices: { type: integer }
        delta_usd: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
