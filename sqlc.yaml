version: "2"
sql:
  - engine: sqlite
    schema: internal/storage/migrations/system
    queries: internal/storage/queries/system.sql
    gen:
      go:
        package: systemdb
        out: internal/storage/sqlc/systemdb
        emit_json_tags: true
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/storage/migrations/data
    queries: internal/storage/queries/data.sql
    gen:
      go:
        package: datadb
        out: internal/storage/sqlc/datadb
        emit_json_tags: true
        emit_empty_slices: true
